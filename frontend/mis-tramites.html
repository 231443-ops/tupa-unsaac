<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trámites - TUPA UNSAAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box .input-group-icon {
            position: absolute;
            left: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-gray-400);
            pointer-events: none;
        }

        .search-box .form-input {
            padding-left: var(--space-10);
        }

        .filters {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: var(--space-2) var(--space-3);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .filter-chip:hover {
            border-color: var(--color-primary);
        }

        .filter-chip.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .table-actions {
            display: flex;
            gap: var(--space-2);
        }

        @media (min-width: 768px) {
            .toolbar {
                flex-direction: row;
                align-items: center;
            }
            .search-box { max-width: 350px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <button class="navbar-toggle" id="sidebar-toggle" aria-label="Menú">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <a href="dashboard.html" class="navbar-brand">
            <div class="navbar-avatar" style="border-radius: var(--radius-lg);">U</div>
            <span>TUPA UNSAAC</span>
        </a>
        <div class="navbar-content">
            <div></div>
            <div class="navbar-actions">
                <div class="navbar-user">
                    <div class="navbar-avatar" id="user-avatar">U</div>
                    <div class="navbar-user-info">
                        <div class="navbar-user-name" id="user-name">Usuario</div>
                        <div class="navbar-user-role" id="user-role">usuario</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <div class="sidebar-section">
                <div class="sidebar-section-title">Principal</div>
                <a href="dashboard.html" class="sidebar-link">
                    <svg class="sidebar-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Panel
                </a>
                <a href="mis-tramites.html" class="sidebar-link active">
                    <svg class="sidebar-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    Mis trámites
                </a>
                <a href="tramite-nuevo.html" class="sidebar-link">
                    <svg class="sidebar-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo trámite
                </a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">Cuenta</div>
                <a href="perfil.html" class="sidebar-link">
                    <svg class="sidebar-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Mi perfil
                </a>
                <a href="#" class="sidebar-link" id="logout-link">
                    <svg class="sidebar-link-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Cerrar sesión
                </a>
            </div>
        </nav>
    </aside>

    <div class="main-layout">
        <main class="main-content">
            <div class="section-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-6);">
                <h1 class="page-title" style="margin:0;">Mis trámites</h1>
                <a href="tramite-nuevo.html" class="btn btn-primary">
                    <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo
                </a>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <span class="input-group-icon">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" id="search" class="form-input" placeholder="Buscar por expediente o procedimiento...">
                </div>
                <div class="filters" id="filters">
                    <button class="filter-chip active" data-estado="">Todos</button>
                    <button class="filter-chip" data-estado="pendiente">Pendientes</button>
                    <button class="filter-chip" data-estado="en_proceso">En proceso</button>
                    <button class="filter-chip" data-estado="observado">Observados</button>
                    <button class="filter-chip" data-estado="aprobado">Aprobados</button>
                    <button class="filter-chip" data-estado="rechazado">Rechazados</button>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-body" id="table-container">
                    <div id="loading" style="text-align:center; padding: var(--space-8);">
                        <div class="spinner" style="margin: 0 auto;"></div>
                    </div>

                    <div class="empty-state" id="empty-state" style="display:none;">
                        <div class="empty-state-icon">
                            <svg width="80" height="80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </div>
                        <h3 class="empty-state-title">No se encontraron trámites</h3>
                        <p class="empty-state-message">Intenta cambiar los filtros o inicia un nuevo trámite.</p>
                    </div>

                    <div id="table-content" style="display:none;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js?v=3"></script>
    <script src="js/main.js?v=3"></script>
    <script>
        const user = App.checkAuth();
        if (user) {
            document.getElementById('user-avatar').textContent = (user.nombre || 'U').charAt(0).toUpperCase();
            document.getElementById('user-name').textContent = user.nombre || 'Usuario';
            document.getElementById('user-role').textContent = user.rol || 'usuario';
        }

        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            App.logout();
        });

        let allTramites = [];
        let currentEstado = '';
        let currentSearch = '';

        async function loadTramites() {
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('table-content');

            loading.style.display = 'block';
            empty.style.display = 'none';
            content.style.display = 'none';

            try {
                const params = { limit: 50 };
                if (currentEstado) params.estado = currentEstado;

                const response = await API.get('tramites/listar.php', params);
                loading.style.display = 'none';

                if (response.success) {
                    allTramites = response.data.tramites;
                    renderTable();
                }
            } catch (error) {
                loading.style.display = 'none';
                App.showToast(error.message, 'error');
            }
        }

        function renderTable() {
            const empty = document.getElementById('empty-state');
            const content = document.getElementById('table-content');

            // Filter by search
            let filtered = allTramites;
            if (currentSearch) {
                const s = currentSearch.toLowerCase();
                filtered = allTramites.filter(t =>
                    t.numero_expediente.toLowerCase().includes(s) ||
                    t.procedimiento_nombre.toLowerCase().includes(s)
                );
            }

            if (filtered.length === 0) {
                empty.style.display = 'flex';
                content.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            content.style.display = 'block';

            content.innerHTML = `<div class="table-container"><table class="table">
                <thead><tr>
                    <th>Expediente</th><th>Procedimiento</th><th>Dependencia</th>
                    <th>Estado</th><th>Fecha</th><th></th>
                </tr></thead>
                <tbody>${filtered.map(t => `
                    <tr style="cursor:pointer" onclick="location.href='detalle.html?id=${t.id}'">
                        <td><strong>${App.escapeHtml(t.numero_expediente)}</strong></td>
                        <td>${App.escapeHtml(t.procedimiento_nombre)}</td>
                        <td class="text-muted">${App.escapeHtml(t.dependencia || '-')}</td>
                        <td><span class="badge badge-${t.estado}">${App.getEstadoText(t.estado)}</span></td>
                        <td>${App.formatDate(t.fecha_inicio, {day:'numeric', month:'short', year:'numeric'})}</td>
                        <td>
                            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--color-gray-400)" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </td>
                    </tr>
                `).join('')}</tbody>
            </table></div>`;
        }

        // Filters
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentEstado = chip.dataset.estado;
                loadTramites();
            });
        });

        // Search (real-time, debounced)
        const searchInput = document.getElementById('search');
        searchInput.addEventListener('input', App.debounce(() => {
            currentSearch = searchInput.value.trim();
            renderTable();
        }, 300));

        loadTramites();
    </script>
</body>
</html>
